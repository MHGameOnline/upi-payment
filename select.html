<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Select Payment App</title>

<style>

body{
font-family: Arial;
text-align:center;
background:#FFBB86FC;
padding:20px;
}

.logo{
width:110px;
margin-bottom:5px;
}

.brand{
font-size:20px;
font-weight:bold;
margin-bottom:20px;
}

.app{
width:90%;
max-width:360px;
background:white;
margin:14px auto;
padding:15px;
border-radius:12px;
display:flex;
align-items:center;
gap:15px;
cursor:pointer;
box-shadow:0 4px 10px rgba(0,0,0,0.2);
}

.app img{
width:40px;
}

.app span{
font-size:18px;
font-weight:bold;
}

</style>
</head>

<body>

<img src="logo.jpeg" class="logo">
<div class="brand">|| Shree Balaji ||</div>

<h3>Select Payment App</h3>

<div class="app" onclick="pay('gpay')">
<img src="gpay.png">
<span>Pay with Google Pay</span>
</div>

<div class="app" onclick="pay('phonepe')">
<img src="phonepe.png">
<span>Pay with PhonePe</span>
</div>

<div class="app" onclick="pay('paytm')">
<img src="paytm.png">
<span>Pay with Paytm</span>
</div>

<script>

const params = new URLSearchParams(window.location.search);
const amount = params.get("amount");

const upiId = "9172990113@ybl";
const name = "Mahendra";

function pay(app){

const upiLink =
`upi://pay?pa=${upiId}&pn=${encodeURIComponent(name)}&am=${amount}&cu=INR&tn=Payment`;

let url="";

if(app==="gpay"){

url=`intent://pay?pa=${upiId}&pn=${encodeURIComponent(name)}&am=${amount}&cu=INR&tn=Payment#Intent;scheme=upi;package=com.google.android.apps.nbu.paisa.user;end`;

}

if(app==="phonepe"){

url=`intent://pay?pa=${upiId}&pn=${encodeURIComponent(name)}&am=${amount}&cu=INR&tn=Payment#Intent;scheme=upi;package=com.phonepe.app;end`;

}

if(app==="paytm"){

url=`intent://pay?pa=${upiId}&pn=${encodeURIComponent(name)}&am=${amount}&cu=INR&tn=Payment#Intent;scheme=upi;package=net.one97.paytm;end`;

}

window.location.href=url;

setTimeout(()=>{
window.location.href=upiLink;
},1200);

}

</script>

</body>
</html>
