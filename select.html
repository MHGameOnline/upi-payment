<!DOCTYPE html>
<html>
<head>
  <title>Select Payment App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: Arial;
      text-align: center;
      padding: 20px;
      background-color: #FFBB86FC;
    }

    .logo {
      width: 120px;
      margin-bottom: 5px;
    }

    .brand {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .app {
      width: 90%;
      max-width: 350px;
      background: white;
      padding: 15px;
      margin: 15px auto;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 15px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    }

    .app img {
      width: 40px;
      height: 40px;
    }

    .app span {
      font-size: 18px;
      font-weight: bold;
      color: #000;
    }
  </style>
</head>

<body>

<img src="logo.jpeg" class="logo">
<div class="brand">|| Shree Balaji ||</div>

<h2>Select Payment App</h2>

<div class="app" onclick="payGPay()">
  <img src="gpay.png" alt="GPay">
  <span>Pay with Google Pay</span>
</div>

<div class="app" onclick="payPhonePe()">
  <img src="phonepe.png" alt="PhonePe">
  <span>Pay with PhonePe</span>
</div>

<div class="app" onclick="payPaytm()">
  <img src="paytm.png" alt="Paytm">
  <span>Pay with Paytm</span>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const amount = params.get("amount");

  const upiId = "9172990113@ybl";
  const name = "Mahendra";

  function payGPay() {
    let url = `upi://pay?pa=${upiId}&pn=${encodeURIComponent(name)}&am=${amount}&cu=INR`;
    window.location.href = url;
  }

  function payPhonePe() {
    let url = `phonepe://pay?pa=${upiId}&pn=${encodeURIComponent(name)}&am=${amount}&cu=INR`;
    fallback(url);
  }

  function payPaytm() {
    let url = `paytmmp://pay?pa=${upiId}&pn=${encodeURIComponent(name)}&am=${amount}&cu=INR`;
    fallback(url);
  }

  function fallback(appUrl) {
    window.location.href = appUrl;
    setTimeout(() => {
      window.location.href =
        `upi://pay?pa=${upiId}&pn=${encodeURIComponent(name)}&am=${amount}&cu=INR`;
    }, 800);
  }
</script>

</body>
</html>
