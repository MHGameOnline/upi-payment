<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UPI Payment</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f5f5f5;
    text-align:center;
    padding:30px;
}

.container{
    background:white;
    max-width:420px;
    margin:auto;
    padding:25px;
    border-radius:10px;
    box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

h2{
    color:#333;
}

.amount{
    font-size:26px;
    color:#28a745;
    font-weight:bold;
    margin:10px 0;
}

.qr{
    margin:20px 0;
}

.qr img{
    width:260px;
    border-radius:8px;
}

.upi{
    margin-top:15px;
    font-size:16px;
    color:#444;
}

.instructions{
    margin-top:20px;
    font-size:14px;
    color:#666;
}

.footer{
    margin-top:20px;
    font-size:12px;
    color:#999;
}
</style>
</head>

<body>

<div class="container">

<h2>Pay via UPI</h2>

<div class="amount">
₹ <span id="amount">0</span>
</div>

<div class="qr">
<img src="wallet.jfif" alt="Scan QR to Pay">
</div>

<div class="upi">
UPI ID: <b>9172990113@ybl</b>
</div>

<div class="instructions">
Open <b>GPay / PhonePe / Paytm</b><br>
Tap <b>Scan QR</b> and complete the payment.
</div>

<div class="footer">
Secure UPI Payment
</div>

</div>

<script>

const params = new URLSearchParams(window.location.search);
const amount = params.get("amount");

if(amount){
document.getElementById("amount").innerText = amount;
}else{
document.getElementById("amount").innerText = "Enter Amount";
}

</script>

</body>
</html>
