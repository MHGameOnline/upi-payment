<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pay</title>

<style>

body{
font-family:Arial;
text-align:center;
background:#FFBB86FC;
padding:20px;
}

.logo{
width:110px;
margin-bottom:5px;
}

.brand{
font-size:20px;
font-weight:bold;
margin-bottom:20px;
}

.amount{
font-size:28px;
font-weight:bold;
margin-bottom:20px;
}

.app{
width:90%;
max-width:360px;
background:white;
margin:12px auto;
padding:15px;
border-radius:12px;
display:flex;
align-items:center;
gap:15px;
cursor:pointer;
box-shadow:0 4px 10px rgba(0,0,0,0.2);
}

.app img{
width:40px;
}

.qr{
margin-top:30px;
}

.qr img{
width:230px;
}

</style>
</head>

<body>

<img src="logo.jpeg" class="logo">

<div class="brand">|| Shree Balaji ||</div>

<div class="amount">
Pay ₹ <span id="amount"></span>
</div>

<div class="app" onclick="pay()">
<img src="gpay.png">
<span>Pay with GPay</span>
</div>

<div class="app" onclick="pay()">
<img src="phonepe.png">
<span>Pay with PhonePe</span>
</div>

<div class="app" onclick="pay()">
<img src="paytm.png">
<span>Pay with Paytm</span>
</div>

<div class="qr">

<h3>OR Scan QR</h3>

<img id="qr">

</div>

<script>

const params=new URLSearchParams(window.location.search);
const amount=params.get("amount");

document.getElementById("amount").innerText=amount;

const upiId="9172990113@ybl";
const name="Mahendra";

const upi=`upi://pay?pa=${upiId}&pn=${name}&am=${amount}&cu=INR`;

function pay(){

window.location.href=upi;

}

/* generate QR automatically */

const qr="https://api.qrserver.com/v1/create-qr-code/?size=250x250&data="+encodeURIComponent(upi);

document.getElementById("qr").src=qr;

</script>

</body>
</html>
