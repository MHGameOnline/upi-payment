<!DOCTYPE html>
<html>
<head>
<title>Enter Amount</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body{
font-family:Arial;
text-align:center;
padding:30px;
background:#FFBB86FC;
}

.logo{
width:120px;
margin-bottom:5px;
}

.brand{
font-size:20px;
font-weight:bold;
margin-bottom:20px;
}

input{
width:80%;
padding:15px;
font-size:18px;
border-radius:10px;
border:1px solid #ccc;
}

.btn{
width:80%;
margin-top:20px;
padding:15px;
font-size:18px;
border:none;
border-radius:12px;
color:white;
background:#FF4081;
box-shadow:0 4px #C2185B;
}

.btn:active{
transform:translateY(2px);
box-shadow:0 2px #C2185B;
}

</style>
</head>

<body>

<img src="logo.jpeg" class="logo">

<div class="brand">|| Shree Balaji ||</div>

<h2>Enter Payment Amount</h2>

<input type="number" id="amount" placeholder="Enter Amount (₹)">

<br>

<button class="btn" onclick="goNext()">Continue</button>

<script>

function goNext(){

let amt=parseInt(document.getElementById("amount").value);

if(!amt || amt<100){
alert("Minimum amount ₹100");
return;
}

window.location.href="pay.html?amount="+amt;

}

</script>

</body>
</html>
